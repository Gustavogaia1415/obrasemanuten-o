{% extends "base.html" %}
{% block title %}Registrar Custo{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Registrar Custo</h1>
<div class="kpi-card" style="max-width: 640px;">
    <form method="POST">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label">Descrição</label>
                <input type="text" name="description" class="form-control" required>
            </div>
            <div class="col-6">
                <label class="form-label">Loja</label>
                <select name="store_id" class="form-select" required>
                    <option value="">Selecione</option>
                    {% for s in stores %}<option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">Tipo de Custo</label>
                <select name="cost_type" class="form-select">
                    {% for k, v in cost_type_labels.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">Valor (R$)</label>
                <input type="number" step="0.01" name="amount" class="form-control" required>
            </div>
            <div class="col-6">
                <label class="form-label">Data</label>
                <input type="date" name="date" class="form-control">
            </div>
            <div class="col-6">
                <label class="form-label">Cód. OS (opcional)</label>
                <select name="service_order_code" class="form-select">
                    <option value="">Nenhuma</option>
                    {% for o in orders %}<option value="{{ o.code }}">{{ o.code }} - {{ o.title }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">Cód. Chamado</label>
                <input type="text" name="request_code" class="form-control">
            </div>
            <div class="col-6">
                <label class="form-label">Fornecedor</label>
                <select name="supplier_id" class="form-select">
                    <option value="">Selecione</option>
                    {% for sup in suppliers %}<option value="{{ sup.id }}">{{ sup.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">Nº Nota Fiscal</label>
                <input type="text" name="invoice_number" class="form-control">
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <a href="{{ url_for('costs.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
