{% extends "base.html" %}
{% block title %}Novo Usuário{% endblock %}
{% block content %}
<h1 class="h4 mb-4">Novo Usuário</h1>
<div class="kpi-card" style="max-width: 480px;">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Senha provisória</label>
            <input type="text" name="password" class="form-control" required minlength="6">
            <div class="form-text">Você vai precisar repassar essa senha pra pessoa (WhatsApp, por exemplo).</div>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" name="is_admin" class="form-check-input" id="isAdmin">
            <label class="form-check-label" for="isAdmin">
                É administrador (pode criar, editar e excluir tudo)
            </label>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
            <a href="{{ url_for('users.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
