{% extends "base.html" %}
{% block title %}{{ 'Editar Loja' if store else 'Nova Loja' }}{% endblock %}
{% block content %}
<h1 class="h4 mb-4">{{ 'Editar Loja' if store else 'Nova Loja' }}</h1>
<div class="kpi-card" style="max-width: 640px;">
    <form method="POST">
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label">Código</label>
                <input type="text" name="code" class="form-control" value="{{ store.code if store else '' }}" required>
            </div>
            <div class="col-6">
                <label class="form-label">Nome</label>
                <input type="text" name="name" class="form-control" value="{{ store.name if store else '' }}" required>
            </div>
            <div class="col-12">
                <label class="form-label">Endereço</label>
                <input type="text" name="address" class="form-control" value="{{ store.address if store else '' }}">
            </div>
            <div class="col-6">
                <label class="form-label">Cidade</label>
                <input type="text" name="city" class="form-control" value="{{ store.city if store else '' }}">
            </div>
            <div class="col-6">
                <label class="form-label">Estado</label>
                <input type="text" name="state" class="form-control" value="{{ store.state if store else '' }}">
            </div>
            <div class="col-6">
                <label class="form-label">Telefone</label>
                <input type="text" name="phone" class="form-control" value="{{ store.phone if store else '' }}">
            </div>
            <div class="col-6">
                <label class="form-label">Responsável</label>
                <input type="text" name="manager" class="form-control" value="{{ store.manager if store else '' }}">
            </div>
            <div class="col-12">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for k, v in {'ativa': 'Ativa', 'inativa': 'Inativa', 'em_reforma': 'Em Reforma'}.items() %}
                    <option value="{{ k }}" {{ 'selected' if store and store.status == k else '' }}>{{ v }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">Orçamento Mensal (R$)</label>
                <input type="number" step="0.01" name="monthly_budget" class="form-control" value="{{ store.monthly_budget if store else '' }}">
            </div>
            <div class="col-6">
                <label class="form-label">Orçamento Anual (R$)</label>
                <input type="number" step="0.01" name="annual_budget" class="form-control" value="{{ store.annual_budget if store else '' }}">
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ 'Atualizar' if store else 'Cadastrar' }}</button>
            <a href="{{ url_for('stores.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
